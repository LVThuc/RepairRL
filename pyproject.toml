[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repairrl"
version = "0.1.0"
description = "Execution-gated Python repair post-training experiment"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0", "transformers==4.56.2", "trl==0.23.1",
  "peft==0.17.1", "accelerate==1.10.1", "bitsandbytes==0.47.0",
  "datasets==4.1.1", "gradio==5.49.1", "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["repairrl*", "agent*", "training*", "evaluation*", "data*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["vendor", "checkpoints", "data/raw", "data/prepared", "data/external"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
